<text x="1560.0" y="730" text-anchor="middle" fill="#e8f2f0" font-size="10.5" font-weight="400">★ 审计: 请求快照+决策人+时间+理由(WORM)</text>
<rect x="875.0" y="794" width="10" height="28" rx="2" fill="#35c2b0" opacity="0.65" stroke="#35c2b0" stroke-width="0.8"/>
