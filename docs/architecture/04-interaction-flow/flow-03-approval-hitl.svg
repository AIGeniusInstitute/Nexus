<path d="M200.0 952 L230.0 952 L230.0 972 L200.0 972" fill="none" stroke="#a855f7" stroke-width="1.6" marker-end="url(#ap)"/>
<text x="238.0" y="958" fill="#e8f2f0" font-size="9.5">item/completed(status=completed/declined)</text>
<rect x="60" y="1054" width="2080" height="280" rx="6" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="68" y="1046" width="75" height="16" rx="3" fill="#0b141a" stroke="#f97316" stroke-width="0.8"/>
<text x="74" y="1058" fill="#f97316" font-size="10" font-weight="600">6 个边界情况处理</text>
<rect x="80" y="1079" width="660" height="100" rx="6" fill="#173341" stroke="#f97316" stroke-width="1"/>
<text x="92" y="1101" fill="#f97316" font-size="11" font-weight="700">① Pod在等待审批时崩了</text>
<text x="92" y="1121" fill="#9db8b4" font-size="10">审批状态在DB,Pod重建后resume</text>
<text x="92" y="1137" fill="#9db8b4" font-size="10">用item_seq去重,同一请求只问一次</text>
<text x="92" y="1153" fill="#9db8b4" font-size="10">已决策的直接重放</text>
<rect x="760" y="1079" width="660" height="100" rx="6" fill="#173341" stroke="#f97316" stroke-width="1"/>
<text x="772" y="1101" fill="#f97316" font-size="11" font-weight="700">② 审批超时</text>
<text x="772" y="1121" fill="#9db8b4" font-size="10">按策略默认动作(建议默认拒绝而非批准)</text>
<text x="772" y="1137" fill="#9db8b4" font-size="10">通知申请人</text>
<text x="772" y="1153" fill="#9db8b4" font-size="10">ticket状态>expired</text>
<rect x="1440" y="1079" width="660" height="100" rx="6" fill="#173341" stroke="#f97316" stroke-width="1"/>
<text x="1452" y="1101" fill="#f97316" font-size="11" font-weight="700">③ 审批期间用户权限被撤销</text>
<text x="1452" y="1121" fill="#9db8b4" font-size="10">决策时重新校验审批人权限,失效则ticket作废(cancelled)</text>
<text x="1452" y="1137" fill="#9db8b4" font-size="10">通知重新审批</text>
<rect x="80" y="1199" width="660" height="100" rx="6" fill="#173341" stroke="#f97316" stroke-width="1"/>
<text x="92" y="1221" fill="#f97316" font-size="11" font-weight="700">④ 用户修改参数后批准</text>
<text x="92" y="1241" fill="#9db8b4" font-size="10">必须重新走策略求值(改参数=新请求)</text>
<text x="92" y="1257" fill="#9db8b4" font-size="10">不能沿用旧审批结果</text>
<text x="92" y="1273" fill="#9db8b4" font-size="10">生成新ticket</text>
<rect x="760" y="1199" width="660" height="100" rx="6" fill="#173341" stroke="#f97316" stroke-width="1"/>
<text x="772" y="1221" fill="#f97316" font-size="11" font-weight="700">⑤ 批量相似请求</text>
<text x="772" y="1241" fill="#9db8b4" font-size="10">提供'同类操作一律批准'作用域</text>
<text x="772" y="1257" fill="#9db8b4" font-size="10">限定:仅该目录/仅该工具/有效期≤1h</text>
<rect x="1440" y="1199" width="660" height="100" rx="6" fill="#173341" stroke="#f97316" stroke-width="1"/>
<text x="1452" y="1221" fill="#f97316" font-size="11" font-weight="700">⑥ 全量审计</text>
<text x="1452" y="1241" fill="#9db8b4" font-size="10">请求快照/决策人/时间/理由全部WORM留存</text>
<text x="1452" y="1257" fill="#9db8b4" font-size="10">不可篡改</text>
<text x="1452" y="1273" fill="#9db8b4" font-size="10">可导出SIEM</text>
<text x="40" y="1354" fill="#9db8b4" font-size="11.5">图 3 - 跨进程审批HITL桥接时序 (审批是控制面一等资源,先落库后回写,6边界全覆盖)</text>
</svg>