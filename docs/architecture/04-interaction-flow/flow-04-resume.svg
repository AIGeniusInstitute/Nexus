<rect x="1775.0" y="962" width="10" height="28" rx="2" fill="#35c2b0" opacity="0.65" stroke="#35c2b0" stroke-width="0.8"/>
<rect x="815.0" y="962" width="10" height="28" rx="2" fill="#35c2b0" opacity="0.65" stroke="#35c2b0" stroke-width="0.8"/>
<path d="M1780.0 976 L820.0 976" fill="none" stroke="#35c2b0" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1300.0" y="970" text-anchor="middle" fill="#e8f2f0" font-size="10.5" font-weight="400">幂等消费(thread_id+turn_id+item_seq)</text>
<path d="M820.0 1044 L850.0 1044 L850.0 1064 L820.0 1064" fill="none" stroke="#22c55e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="858.0" y="1050" fill="#e8f2f0" font-size="9.5">对比云端vs新事件 > 无缺口=一致</text>
<rect x="60" y="1142" width="1680" height="100" rx="6" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="68" y="1134" width="47" height="16" rx="3" fill="#0b141a" stroke="#22c55e" stroke-width="0.8"/>
<text x="74" y="1146" fill="#22c55e" font-size="10" font-weight="600">一致性保证</text>
<rect x="80" y="1162" width="1640" height="30" rx="4" fill="#13242e" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
<text x="88" y="1178" fill="#22c55e" font-size="10" font-weight="600">云端Postgres是唯一真相源; Harness本地SQLite/rollout是可丢弃缓存</text>
<rect x="80" y="1197" width="1640" height="30" rx="4" fill="#13242e" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
<text x="88" y="1213" fill="#22c55e" font-size="10" font-weight="600">resume后新事件seq = MAX(云端已落库seq)+1 > 前端无重复无缺失</text>
<text x="40" y="1262" fill="#9db8b4" font-size="11.5">图 4 - thread/resume恢复流程 (Pod随时可死,云端状态可重建resume)</text>
</svg>