<rect x="1455.0" y="622" width="10" height="28" rx="2" fill="#a855f7" opacity="0.65" stroke="#a855f7" stroke-width="0.8"/>
<rect x="1135.0" y="622" width="10" height="28" rx="2" fill="#3b82f6" opacity="0.65" stroke="#3b82f6" stroke-width="0.8"/>
<path d="M1460.0 636 L1140.0 636" fill="none" stroke="#a855f7" stroke-width="1.6" marker-end="url(#ap)"/>
<text x="1300.0" y="630" text-anchor="middle" fill="#e8f2f0" font-size="10.5" font-weight="400">下载rollout到Pod内本地</text>
<path d="M1460.0 704 L1490.0 704 L1490.0 724 L1460.0 724" fill="none" stroke="#a855f7" stroke-width="1.6" marker-end="url(#ap)"/>
<text x="1498.0" y="710" fill="#e8f2f0" font-size="9.5">thread/resume(threadId)
加载rollout > 重建内存状态</text>
<rect x="1455.0" y="758" width="10" height="28" rx="2" fill="#a855f7" opacity="0.65" stroke="#a855f7" stroke-width="0.8"/>
<rect x="815.0" y="758" width="10" height="28" rx="2" fill="#35c2b0" opacity="0.65" stroke="#35c2b0" stroke-width="0.8"/>
<path d="M1460.0 772 L820.0 772" fill="none" stroke="#a855f7" stroke-width="1.6" marker-end="url(#ap)"/>
<text x="1140.0" y="766" text-anchor="middle" fill="#e8f2f0" font-size="10.5" font-weight="400">resume成功 > 报告ready</text>
<path d="M1460.0 840 L1490.0 840 L1490.0 860 L1460.0 860" fill="none" stroke="#a855f7" stroke-width="1.6" marker-end="url(#ap)"/>
