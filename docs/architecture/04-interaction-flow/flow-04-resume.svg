<text x="1780.0" y="100" text-anchor="middle" fill="#35c2b0" font-size="12.5" font-weight="700">Event Consumer</text>
<text x="1780.0" y="120" text-anchor="middle" fill="#9db8b4" font-size="9.5">L3(继续消费)</text>
