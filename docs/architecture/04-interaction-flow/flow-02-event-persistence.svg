<rect x="60" y="1380" width="900" height="120" rx="6" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="68" y="1372" width="110" height="16" rx="3" fill="#0b141a" stroke="#a855f7" stroke-width="0.8"/>
