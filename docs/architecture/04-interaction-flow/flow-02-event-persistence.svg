<rect width="2000" height="1600" fill="#0b141a"/>
<text x="40" y="32" fill="#35c2b0" font-size="22" font-weight="700">Nexus 会话事件流持久化流程</text>
<text x="40" y="56" fill="#9db8b4" font-size="13">app-server事件 > 控制面消费者at-least-once > 幂等写入Postgres+对象存储rollout > WS推前端 (含seq缺口补齐/fork/resume语义)</text>
