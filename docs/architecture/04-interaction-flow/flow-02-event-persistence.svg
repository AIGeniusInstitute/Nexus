<rect x="80" y="1400" width="860" height="40" rx="4" fill="#13242e" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2"/>
<text x="88" y="1416" fill="#a855f7" font-size="10" font-weight="600">fork: thread/fork > 新thread_id, 复制item元数据(不复制大字段实体), 用于分叉探索</text>
<rect x="80" y="1445" width="860" height="40" rx="4" fill="#13242e" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2"/>
<text x="88" y="1461" fill="#a855f7" font-size="10" font-weight="600">resume: 新Pod > 下载rollout > thread/resume > 新事件seq从云端最大值继续</text>
<rect x="1000" y="1380" width="940" height="120" rx="6" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,3"/>
<rect x="1008" y="1372" width="54" height="16" rx="3" fill="#0b141a" stroke="#ef4444" stroke-width="0.8"/>
<text x="1014" y="1384" fill="#ef4444" font-size="10" font-weight="600">关键设计约束</text>
<rect x="1020" y="1400" width="900" height="40" rx="4" fill="#13242e" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
<text x="1028" y="1416" fill="#ef4444" font-size="10" font-weight="600">不阻塞Harness: 写库失败不能反压app-server, 降级到本地队列+告警</text>
<rect x="1020" y="1445" width="900" height="40" rx="4" fill="#13242e" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
<text x="1028" y="1461" fill="#ef4444" font-size="10" font-weight="600">大字段外置: shell输出/diff >64KB 只存对象存储引用+摘要</text>
<text x="40" y="1520" fill="#9db8b4" font-size="11.5">图 2 - 会话事件流持久化流程 (at-least-once + 幂等键 + seq补齐 + fork/resume)</text>
</svg>