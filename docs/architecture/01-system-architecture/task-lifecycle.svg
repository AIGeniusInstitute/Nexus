<text x="825" y="333" text-anchor="middle" fill="#e8f2f0" font-size="11" font-weight="700">auto compact</text>
<path d="M925 326 L940 326" fill="none" stroke="#35c2b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="940" y="290" width="200" height="72" rx="8" fill="#173341" stroke="#e8b64c" stroke-width="1.2"/>
