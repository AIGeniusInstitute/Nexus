<rect width="1600" height="720" fill="#0b141a"/>
<text x="40" y="40" fill="#35c2b0" font-size="22" font-weight="700">Nexus 控制平面 / 执行平面 · 物理切分</text>
<text x="40" y="64" fill="#9db8b4" font-size="13">最关键的一条线：长期有状态多租户控制面 ↔ 一次性单任务可销毁执行面，仅经 app-server 协议与对象存储通信</text>
<rect x="40" y="90" width="1520" height="250" rx="14" fill="#13242e" stroke="#028090" stroke-width="2"/>
