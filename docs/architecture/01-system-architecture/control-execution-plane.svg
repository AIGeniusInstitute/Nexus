<text x="1160" y="280" text-anchor="middle" fill="#9db8b4" font-size="10.5">artifacts · rollouts · snapshots · 向量库</text>
<text x="1160" y="298" text-anchor="middle" fill="#9db8b4" font-size="10.5">禁用租户 CMK → 数据不可解密</text>
<path d="M800 340 L800 400" fill="none" stroke="#e8b64c" stroke-width="2.2" marker-end="url(#ag)"/>
