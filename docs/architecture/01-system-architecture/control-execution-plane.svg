<rect x="80" y="595" width="1440" height="40" rx="6" fill="#173341" stroke="#028090"/>
<text x="800" y="620" text-anchor="middle" fill="#35c2b0" font-size="12" font-weight="700">出站仅放行 → Model Gateway 与 MCP Gateway 两个白名单地址（其余全 deny）</text>
<text x="40" y="660" fill="#9db8b4" font-size="11.5">图 2 · 控制平面 / 执行平面物理切分（三重取证：网络策略 + 独立密钥 + 独立存储前缀）</text>
