<text x="820" y="394" fill="#35c2b0" font-size="11" font-weight="700">② app-server JSON-RPC</text>
<rect x="40" y="400" width="1520" height="270" rx="14" fill="#13242e" stroke="#e8b64c" stroke-width="2"/>
