<text x="490" y="528" text-anchor="middle" fill="#e8f2f0" font-size="11" font-weight="700">git worktree</text>
<text x="490" y="544" text-anchor="middle" fill="#e8f2f0" font-size="11" font-weight="700">/PVC 快照</text>
<rect x="640" y="490" width="260" height="80" rx="8" fill="#173341" stroke="#a855f7" stroke-width="1.2"/>
