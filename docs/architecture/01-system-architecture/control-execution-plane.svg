<rect x="360" y="490" width="260" height="80" rx="8" fill="#173341" stroke="#3b82f6" stroke-width="1.2"/>
<text x="490.0" y="534.0" text-anchor="middle" fill="#e8f2f0" font-size="12" font-weight="400"></text>
