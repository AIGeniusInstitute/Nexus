<text x="770" y="528" text-anchor="middle" fill="#e8f2f0" font-size="11" font-weight="700">凭据注入·工具白名单</text>
<text x="770" y="544" text-anchor="middle" fill="#e8f2f0" font-size="11" font-weight="700">出站代理·审计脱敏</text>
<rect x="920" y="490" width="260" height="80" rx="8" fill="#173341" stroke="#e8b64c" stroke-width="1.2"/>
